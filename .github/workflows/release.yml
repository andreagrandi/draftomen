name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(uv version --short)"
          website_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const metadata = JSON.parse(readFileSync("website/package.json", "utf8"));
            if (typeof metadata.version !== "string" || metadata.version.length === 0) {
              throw new Error("website/package.json must contain a non-empty string version.");
            }
            process.stdout.write(metadata.version);
          ')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "${tag_version}" != "${website_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match website/package.json version ${website_version}."
            exit 1
          fi

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build website
        run: npm run build --prefix website

      - name: Validate website release output
        run: node website/scripts/check-release-output.mjs "${GITHUB_REF_NAME}"

      - name: Validate release changelog
        run: >-
          python3 scripts/extract_changelog.py
          --section "${GITHUB_REF_NAME#v}"
          --output "$RUNNER_TEMP/release-notes.md"

      - name: Run checks
        run: uv run nox -s ci

  native-bundles:
    name: Build native desktop bundles
    uses: ./.github/workflows/native-bundles.yml
    with:
      sign_macos: true
    # A called workflow sees only the secrets its caller passes, even in a job
    # that declares the environment holding them.
    secrets: inherit
    permissions:
      actions: read
      contents: write

  github-release:
    name: Publish GitHub Release
    needs:
      - validate
      - native-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract release changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog.py \
            --section "${GITHUB_REF_NAME#v}" \
            --output release-notes.md

      - name: Download macOS arm64 signed bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-arm64-signed-release
          path: release-assets/macos-arm64

      - name: Download macOS x86_64 signed bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-x86_64-signed-release
          path: release-assets/macos-x86_64

      - name: Download Windows native bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-windows-unsigned-development
          path: release-assets/windows

      - name: Rename native bundles and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          macos_arm64_name="draftomen-${RELEASE_TAG}-macos-arm64.dmg"
          macos_x86_64_name="draftomen-${RELEASE_TAG}-macos-x86_64.dmg"
          windows_name="draftomen-${RELEASE_TAG}-unsigned-windows.exe"
          checksums_name="draftomen-${RELEASE_TAG}-sha256sums.txt"

          mkdir -p release-assets/published
          mv release-assets/macos-arm64/Draftomen-signed-macos-arm64.dmg \
            "release-assets/published/${macos_arm64_name}"
          mv release-assets/macos-x86_64/Draftomen-signed-macos-x86_64.dmg \
            "release-assets/published/${macos_x86_64_name}"
          mv release-assets/windows/Draftomen-unsigned-windows.exe \
            "release-assets/published/${windows_name}"

          (
            cd release-assets/published
            sha256sum "${macos_arm64_name}" "${macos_x86_64_name}" "${windows_name}" \
              > "${checksums_name}"
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" \
            "release-assets/published/draftomen-${RELEASE_TAG}-macos-arm64.dmg" \
            "release-assets/published/draftomen-${RELEASE_TAG}-macos-x86_64.dmg" \
            "release-assets/published/draftomen-${RELEASE_TAG}-unsigned-windows.exe" \
            "release-assets/published/draftomen-${RELEASE_TAG}-sha256sums.txt" \
            --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
