name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(uv version --short)"
          website_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const metadata = JSON.parse(readFileSync("website/package.json", "utf8"));
            if (typeof metadata.version !== "string" || metadata.version.length === 0) {
              throw new Error("website/package.json must contain a non-empty string version.");
            }
            process.stdout.write(metadata.version);
          ')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "${tag_version}" != "${website_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match website/package.json version ${website_version}."
            exit 1
          fi

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build website
        run: npm run build --prefix website

      - name: Validate website release output
        run: node website/scripts/check-release-output.mjs "${GITHUB_REF_NAME}"

      - name: Validate release changelog
        run: >-
          python3 scripts/extract_changelog.py
          --section "${GITHUB_REF_NAME#v}"
          --output "$RUNNER_TEMP/release-notes.md"

      - name: Run checks
        run: uv run nox -s ci

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke-test wheel
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.whl"

      - name: Smoke-test source distribution
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.tar.gz"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  platform-smoke:
    name: Smoke-test wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Smoke-test wheel
        run: uv run --no-project --python 3.12 python tests/package_smoke.py "dist/*.whl"

  publish:
    name: Publish distributions
    needs:
      - build
      - platform-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/draftomen
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  native-bundles:
    name: Build native desktop bundles
    uses: ./.github/workflows/native-bundles.yml
    permissions:
      actions: read
      contents: write

  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  github-release:
    name: Publish GitHub Release
    needs:
      - publish
      - native-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract release changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog.py \
            --section "${GITHUB_REF_NAME#v}" \
            --output release-notes.md

      - name: Download macOS native bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-unsigned-development
          path: release-assets/macos

      - name: Download Windows native bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-windows-unsigned-development
          path: release-assets/windows

      - name: Rename native bundles and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          macos_name="draftomen-${RELEASE_TAG}-unsigned-macos.dmg"
          windows_name="draftomen-${RELEASE_TAG}-unsigned-windows.exe"
          checksums_name="draftomen-${RELEASE_TAG}-unsigned-sha256sums.txt"

          mkdir -p release-assets/published
          mv release-assets/macos/Draftomen-unsigned-macos.dmg \
            "release-assets/published/${macos_name}"
          mv release-assets/windows/Draftomen-unsigned-windows.exe \
            "release-assets/published/${windows_name}"

          (
            cd release-assets/published
            sha256sum "${macos_name}" "${windows_name}" > "${checksums_name}"
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" \
            "release-assets/published/draftomen-${RELEASE_TAG}-unsigned-macos.dmg" \
            "release-assets/published/draftomen-${RELEASE_TAG}-unsigned-windows.exe" \
            "release-assets/published/draftomen-${RELEASE_TAG}-unsigned-sha256sums.txt" \
            --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
