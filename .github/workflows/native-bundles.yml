name: Build native desktop bundles

run-name: ${{ inputs.request_id && format('Development release request {0}', inputs.request_id) || 'Build native desktop bundles' }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier for this development release
        required: false
        type: string

permissions:
  contents: read

env:
  # The native smoke helper launches the compiled app, not source Python.
  # Offscreen keeps the mock inspection deterministic on hosted runners.
  QT_QPA_PLATFORM: offscreen

jobs:
  native-bundle:
    name: Build unsigned ${{ matrix.platform }} development bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            config: pysidedeploy.macos.spec
            bundle: Draftomen-unsigned-macos.app
            artifact: Draftomen-unsigned-macos.dmg
            artifact_name: draftomen-macos-unsigned-development
            smoke_timeout: 60
          - os: windows-latest
            platform: windows
            config: pysidedeploy.windows.spec
            bundle: Draftomen-unsigned-windows.exe
            artifact: Draftomen-unsigned-windows.exe
            artifact_name: draftomen-windows-unsigned-development
            smoke_timeout: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install pinned Nuitka deployment dependency
        run: uv pip install "Nuitka==4.1.3"

      - name: Verify bundled profile provenance before build
        run: uv run pytest -q tests/test_desktop_bundle.py::test_bundled_profile_provenance_and_packaging_are_deterministic

      - name: Seed verified Dependency Walker
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DEPENDENCY_WALKER_SHA256: 35db68a613874a2e8c1422eb0ea7861f825fc71717d46dabf1f249ce9634b4f1
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "nuitka-downloads"
          $dependencyDirectory = Join-Path $cache "depends\x86_64"
          New-Item -ItemType Directory -Force -Path $dependencyDirectory | Out-Null

          $archive = Join-Path $dependencyDirectory "depends22_x64.zip"
          Invoke-WebRequest `
            -Uri "https://dependencywalker.com/depends22_x64.zip" `
            -OutFile $archive
          $actualHash = (
            Get-FileHash -LiteralPath $archive -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:DEPENDENCY_WALKER_SHA256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "Dependency Walker archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath $dependencyDirectory `
            -Force
          $executable = Join-Path $dependencyDirectory "depends.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Dependency Walker executable missing after extraction."
          }

          "NUITKA_CACHE_DIR_DOWNLOADS=$cache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create bundle output directory
        run: >-
          uv run python -c
          "from pathlib import Path; Path('dist-native/${{ matrix.platform }}-unsigned').mkdir(parents=True, exist_ok=True)"

      - name: Build unsigned bundle
        run: uv run pyside6-deploy --config-file "${{ matrix.config }}" --force

      - name: Create macOS unsigned development DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/draftomen-macos-dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          mv \
            "dist-native/macos-unsigned/${{ matrix.bundle }}" \
            "$staging/${{ matrix.bundle }}"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Draft Omen" -srcfolder "$staging" -ov -format UDZO \
            "dist-native/macos-unsigned/${{ matrix.artifact }}"

      - name: Smoke-test mounted macOS DMG with deterministic mock data
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/draftomen-macos-mount"
          rm -rf "$mountpoint"
          mkdir -p "$mountpoint"
          cleanup() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rm -rf "$mountpoint"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mountpoint" \
            "dist-native/macos-unsigned/${{ matrix.artifact }}"
          uv run python tests/bundle_smoke.py \
            --timeout "${{ matrix.smoke_timeout }}" \
            "$mountpoint/${{ matrix.bundle }}"
          hdiutil detach "$mountpoint"
          trap - EXIT
          rm -rf "$mountpoint"

      - name: Smoke-test Windows executable with deterministic mock data
        if: matrix.platform == 'windows'
        run: >-
          uv run python tests/bundle_smoke.py
          --timeout "${{ matrix.smoke_timeout }}"
          "dist-native/windows-unsigned/${{ matrix.bundle }}"

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-native/${{ matrix.platform }}-unsigned/${{ matrix.artifact }}
          if-no-files-found: error
          overwrite: true

  publish-development:
    name: Publish rolling development release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch }}
    needs: native-bundle
    runs-on: ubuntu-latest
    concurrency:
      group: development-release-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"

      - name: Download macOS unsigned development bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-unsigned-development
          path: release-assets/macos

      - name: Download Windows unsigned development bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-windows-unsigned-development
          path: release-assets/windows

      - name: Derive development build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(uv version --short)"
          utc_date="$(date -u +%Y%m%d)"
          release_date="${utc_date:0:4}-${utc_date:4:2}-${utc_date:6:2}"
          build_identifier="v${package_version}-dev.${utc_date}.${GITHUB_RUN_NUMBER}"
          release_title="Draft Omen v${package_version} development build ${release_date} #${GITHUB_RUN_NUMBER}"

          {
            echo "package_version=${package_version}"
            echo "release_date=${release_date}"
            echo "build_identifier=${build_identifier}"
            echo "release_title=${release_title}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Unreleased changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog.py \
            --section Unreleased \
            --output "$RUNNER_TEMP/development-changelog.md"

      - name: Publish rolling development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: development
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          BUILD_IDENTIFIER: ${{ steps.metadata.outputs.build_identifier }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          latest_run_number="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/native-bundles.yml/runs" \
              -f event=workflow_dispatch \
              -f branch="${GITHUB_REF_NAME}" \
              -f per_page=100 \
              --jq '[.workflow_runs[].run_number] | max // 0'
          )"
          if (( latest_run_number > GITHUB_RUN_NUMBER )); then
            echo "Skipping stale development run ${GITHUB_RUN_NUMBER}; a newer request uses run ${latest_run_number}."
            exit 0
          fi

          macos_name="draftomen-${BUILD_IDENTIFIER}-unsigned-macos.dmg"
          windows_name="draftomen-${BUILD_IDENTIFIER}-unsigned-windows.exe"
          checksums_name="draftomen-${BUILD_IDENTIFIER}-unsigned-sha256sums.txt"
          mkdir -p release-assets/published
          mv release-assets/macos/Draftomen-unsigned-macos.dmg \
            "release-assets/published/${macos_name}"
          mv release-assets/windows/Draftomen-unsigned-windows.exe \
            "release-assets/published/${windows_name}"
          (
            cd release-assets/published
            sha256sum "${macos_name}" "${windows_name}" > "${checksums_name}"
          )

          git tag --force "${RELEASE_TAG}" "${SOURCE_COMMIT}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

          notes_file="${RUNNER_TEMP}/development-release-notes.md"
          {
            cat <<EOF
          # ${RELEASE_TITLE}

          - Build identifier: \`${BUILD_IDENTIFIER}\`
          - Source commit: \`${SOURCE_COMMIT}\`
          - Package version: \`${PACKAGE_VERSION}\`
          - UTC date: \`${RELEASE_DATE}\`
          - Progressive run number: ${GITHUB_RUN_NUMBER}
          - Warning: This is an unsigned native development build.
          - Workflow run: ${WORKFLOW_RUN_URL}

          ## Changes since previous release

          EOF
            cat "${RUNNER_TEMP}/development-changelog.md"
          } > "${notes_file}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --prerelease \
              --title "${RELEASE_TITLE}" \
              --notes-file "${notes_file}" \
              --target "${SOURCE_COMMIT}"
          else
            gh release create "${RELEASE_TAG}" \
              --prerelease \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file "${notes_file}"
          fi

          existing_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --yes
          done <<< "${existing_assets}"

          gh release upload "${RELEASE_TAG}" \
            "release-assets/published/${macos_name}" \
            "release-assets/published/${windows_name}" \
            "release-assets/published/${checksums_name}"
