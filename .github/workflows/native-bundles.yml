name: Build native desktop bundles

run-name: ${{ inputs.request_id && format('Development release request {0}', inputs.request_id) || 'Build native desktop bundles' }}

on:
  workflow_call:
    inputs:
      sign_macos:
        description: Sign, notarize and staple the macOS DMGs with the macos-release credentials
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier for this development release
        required: false
        type: string

permissions:
  contents: read

env:
  # The native smoke helper launches the compiled app, not source Python.
  # Offscreen keeps the mock inspection deterministic on hosted runners.
  QT_QPA_PLATFORM: offscreen

jobs:
  native-bundle:
    name: Build ${{ inputs.sign_macos && matrix.platform == 'macos' && 'signed' || 'unsigned' }} ${{ matrix.platform }} ${{ matrix.arch }} bundle
    runs-on: ${{ matrix.os }}
    # Only signed macOS jobs enter the environment that holds the Apple
    # credentials. Its deployment policy admits v* tags only.
    environment: ${{ inputs.sign_macos && matrix.platform == 'macos' && 'macos-release' || '' }}
    env:
      MACOS_SIGNED: ${{ inputs.sign_macos && matrix.platform == 'macos' }}
      BUNDLE_DIRECTORY: ${{ inputs.sign_macos && matrix.platform == 'macos' && 'dist-native/macos-signed' || format('dist-native/{0}-unsigned', matrix.platform) }}
      BUNDLE: ${{ inputs.sign_macos && matrix.platform == 'macos' && 'Draft Omen.app' || matrix.bundle }}
      ARTIFACT: ${{ inputs.sign_macos && matrix.platform == 'macos' && format('Draftomen-signed-macos-{0}.dmg', matrix.arch) || matrix.artifact }}
      ARTIFACT_NAME: ${{ inputs.sign_macos && matrix.platform == 'macos' && format('draftomen-macos-{0}-signed-release', matrix.arch) || matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            config: pysidedeploy.macos.spec
            bundle: Draftomen-unsigned-macos.app
            artifact: Draftomen-unsigned-macos-arm64.dmg
            artifact_name: draftomen-macos-arm64-unsigned-development
            smoke_timeout: 60
          # Nuitka builds for the host architecture, so the Intel bundle needs
          # an Intel runner. Intel support lasts as long as GitHub offers one.
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            config: pysidedeploy.macos.spec
            bundle: Draftomen-unsigned-macos.app
            artifact: Draftomen-unsigned-macos-x86_64.dmg
            artifact_name: draftomen-macos-x86_64-unsigned-development
            smoke_timeout: 60
          - os: windows-latest
            platform: windows
            arch: x86_64
            config: pysidedeploy.windows.spec
            bundle: Draftomen-unsigned-windows.exe
            artifact: Draftomen-unsigned-windows.exe
            artifact_name: draftomen-windows-unsigned-development
            smoke_timeout: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Runs before the build so missing or wrong credentials fail in seconds.
      - name: Import Developer ID certificate into a temporary keychain
        if: env.MACOS_SIGNED == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not set in the macos-release environment."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/draftomen-signing.keychain-db"
          certificate="$RUNNER_TEMP/draftomen-signing.p12"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"

          (umask 077; printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null

          # Nuitka calls codesign without --keychain, so the temporary keychain
          # must be on the user search list.
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            search_list+=("${entry//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"

          identity="$(
            security find-identity -v -p codesigning "$keychain" |
              awk -v team="($APPLE_TEAM_ID)" \
                '/Developer ID Application/ && index($0, team) { print $2; exit }'
          )"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the certificate."
            exit 1
          fi
          echo "Signing identity SHA-1: $identity"
          {
            echo "MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "MACOS_SIGNING_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install pinned Nuitka deployment dependency
        run: uv pip install "Nuitka==4.1.3"

      - name: Verify bundled profile provenance before build
        run: uv run pytest -q tests/test_desktop_bundle.py::test_bundled_profile_provenance_and_packaging_are_deterministic

      - name: Seed verified Dependency Walker
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DEPENDENCY_WALKER_SHA256: 35db68a613874a2e8c1422eb0ea7861f825fc71717d46dabf1f249ce9634b4f1
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "nuitka-downloads"
          $dependencyDirectory = Join-Path $cache "depends\x86_64"
          New-Item -ItemType Directory -Force -Path $dependencyDirectory | Out-Null

          $archive = Join-Path $dependencyDirectory "depends22_x64.zip"
          Invoke-WebRequest `
            -Uri "https://dependencywalker.com/depends22_x64.zip" `
            -OutFile $archive
          $actualHash = (
            Get-FileHash -LiteralPath $archive -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:DEPENDENCY_WALKER_SHA256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "Dependency Walker archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath $dependencyDirectory `
            -Force
          $executable = Join-Path $dependencyDirectory "depends.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Dependency Walker executable missing after extraction."
          }

          "NUITKA_CACHE_DIR_DOWNLOADS=$cache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create bundle output directory
        run: >-
          uv run python -c
          "from pathlib import Path; Path('${{ env.BUNDLE_DIRECTORY }}').mkdir(parents=True, exist_ok=True)"

      - name: Build unsigned bundle
        if: env.MACOS_SIGNED != 'true'
        run: uv run pyside6-deploy --config-file "${{ matrix.config }}" --force

      # pyside6-deploy copies Nuitka's app to exec_directory with
      # shutil.copytree, which drops the com.apple.cs.* extended attributes
      # that hold the signatures of the QML and other data files. The build
      # keeps Nuitka's own output and copies it with ditto, which keeps them.
      - name: Build signed macOS bundle
        if: env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          spec=pysidedeploy.macos.signed.spec
          sed -E \
            -e 's|^title = .*$|title = Draftomen-signed-macos|' \
            -e "s|^exec_directory = .*$|exec_directory = $BUNDLE_DIRECTORY|" \
            -e "s|^(extra_args = .*)$|\1 --macos-sign-identity=$MACOS_SIGNING_IDENTITY --macos-sign-notarization|" \
            "${{ matrix.config }}" > "$spec"
          if ! grep -q -- "--macos-sign-notarization" "$spec"; then
            echo "::error::Could not add the signing options to $spec."
            exit 1
          fi
          uv run pyside6-deploy --config-file "$spec" --force --keep-deployment-files

          nuitka_app=draftomen/deployment/qt_gui.app
          codesign --verify --deep --strict --verbose=2 "$nuitka_app"
          rm -rf "${BUNDLE_DIRECTORY:?}/Draftomen-signed-macos.app" "${BUNDLE_DIRECTORY:?}/$BUNDLE"
          ditto "$nuitka_app" "$BUNDLE_DIRECTORY/$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_DIRECTORY/$BUNDLE"
          codesign -dvv "$BUNDLE_DIRECTORY/$BUNDLE" 2>&1 |
            grep -E "^(Authority|TeamIdentifier|Timestamp|CodeDirectory)"

      - name: Verify macOS bundle architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$BUNDLE_DIRECTORY/$BUNDLE"
          executable="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")"
          archs="$(lipo -archs "$bundle/Contents/MacOS/$executable")"
          echo "$executable architectures: $archs"
          if [[ "$archs" != "${{ matrix.arch }}" ]]; then
            echo "::error::Expected ${{ matrix.arch }} bundle, got: $archs"
            exit 1
          fi

      - name: Create macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/draftomen-macos-dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          # ditto and hdiutil -srcfolder both keep the extended attributes
          # that hold the data-file signatures.
          ditto "$BUNDLE_DIRECTORY/$BUNDLE" "$staging/$BUNDLE"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Draft Omen" -srcfolder "$staging" -ov -format UDZO \
            "$BUNDLE_DIRECTORY/$ARTIFACT"

      - name: Sign, notarize and staple macOS DMG
        if: env.MACOS_SIGNED == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg="$BUNDLE_DIRECTORY/$ARTIFACT"
          codesign --sign "$MACOS_SIGNING_IDENTITY" --keychain "$MACOS_SIGNING_KEYCHAIN" \
            --timestamp "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

          api_key="$RUNNER_TEMP/draftomen-notary.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key")
          notary_auth=(--key "$api_key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          result="$RUNNER_TEMP/draftomen-notary-result.json"
          submit_status=0
          xcrun notarytool submit "$dmg" "${notary_auth[@]}" \
            --wait --timeout 1h --output-format json > "$result" || submit_status=$?
          cat "$result"
          submission_id="$(plutil -extract id raw -o - "$result" 2>/dev/null || true)"
          status="$(plutil -extract status raw -o - "$result" 2>/dev/null || true)"
          if [[ "$submit_status" -ne 0 || "$status" != "Accepted" ]]; then
            echo "::error::Notarization ended with status '${status:-unknown}'."
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" "${notary_auth[@]}" || true
            fi
            exit 1
          fi
          rm -f "$api_key"

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Smoke-test mounted macOS DMG with deterministic mock data
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/draftomen-macos-mount"
          rm -rf "$mountpoint"
          mkdir -p "$mountpoint"
          # A process that inspects the app, such as a Gatekeeper scan, can
          # keep the volume busy for a few seconds after the app exits.
          detach_image() {
            for _ in 1 2 3 4 5; do
              if hdiutil detach "$mountpoint"; then
                return 0
              fi
              sleep 5
            done
            hdiutil detach -force "$mountpoint"
          }
          cleanup() {
            detach_image >/dev/null 2>&1 || true
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mountpoint" \
            "$BUNDLE_DIRECTORY/$ARTIFACT"
          if [[ "$MACOS_SIGNED" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$mountpoint/$BUNDLE"
          fi
          uv run python tests/bundle_smoke.py \
            --timeout "${{ matrix.smoke_timeout }}" \
            "$mountpoint/$BUNDLE"
          detach_image
          trap - EXIT
          rmdir "$mountpoint"

      - name: Smoke-test Windows executable with deterministic mock data
        if: matrix.platform == 'windows'
        run: >-
          uv run python tests/bundle_smoke.py
          --timeout "${{ matrix.smoke_timeout }}"
          "dist-native/windows-unsigned/${{ matrix.bundle }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUNDLE_DIRECTORY }}/${{ env.ARTIFACT }}
          if-no-files-found: error
          overwrite: true

      - name: Remove temporary signing keychain and credentials
        if: always() && env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/draftomen-signing.keychain-db"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f \
            "$RUNNER_TEMP/draftomen-signing.p12" \
            "$RUNNER_TEMP/draftomen-notary.p8" \
            "$RUNNER_TEMP/draftomen-notary-result.json"

  publish-development:
    name: Publish rolling development release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch }}
    needs: native-bundle
    runs-on: ubuntu-latest
    concurrency:
      group: development-release-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"

      - name: Download macOS arm64 unsigned development bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-arm64-unsigned-development
          path: release-assets/macos-arm64

      - name: Download macOS x86_64 unsigned development bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-macos-x86_64-unsigned-development
          path: release-assets/macos-x86_64

      - name: Download Windows unsigned development bundle
        uses: actions/download-artifact@v8
        with:
          name: draftomen-windows-unsigned-development
          path: release-assets/windows

      - name: Derive development build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(uv version --short)"
          utc_date="$(date -u +%Y%m%d)"
          release_date="${utc_date:0:4}-${utc_date:4:2}-${utc_date:6:2}"
          build_identifier="v${package_version}-dev.${utc_date}.${GITHUB_RUN_NUMBER}"
          release_title="Draft Omen v${package_version} development build ${release_date} #${GITHUB_RUN_NUMBER}"

          {
            echo "package_version=${package_version}"
            echo "release_date=${release_date}"
            echo "build_identifier=${build_identifier}"
            echo "release_title=${release_title}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Unreleased changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog.py \
            --section Unreleased \
            --output "$RUNNER_TEMP/development-changelog.md"

      - name: Publish rolling development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: development
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          BUILD_IDENTIFIER: ${{ steps.metadata.outputs.build_identifier }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          latest_run_number="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/native-bundles.yml/runs" \
              -f event=workflow_dispatch \
              -f branch="${GITHUB_REF_NAME}" \
              -f per_page=100 \
              --jq '[.workflow_runs[].run_number] | max // 0'
          )"
          if (( latest_run_number > GITHUB_RUN_NUMBER )); then
            echo "Skipping stale development run ${GITHUB_RUN_NUMBER}; a newer request uses run ${latest_run_number}."
            exit 0
          fi

          macos_arm64_name="draftomen-${BUILD_IDENTIFIER}-unsigned-macos-arm64.dmg"
          macos_x86_64_name="draftomen-${BUILD_IDENTIFIER}-unsigned-macos-x86_64.dmg"
          windows_name="draftomen-${BUILD_IDENTIFIER}-unsigned-windows.exe"
          checksums_name="draftomen-${BUILD_IDENTIFIER}-unsigned-sha256sums.txt"
          mkdir -p release-assets/published
          mv release-assets/macos-arm64/Draftomen-unsigned-macos-arm64.dmg \
            "release-assets/published/${macos_arm64_name}"
          mv release-assets/macos-x86_64/Draftomen-unsigned-macos-x86_64.dmg \
            "release-assets/published/${macos_x86_64_name}"
          mv release-assets/windows/Draftomen-unsigned-windows.exe \
            "release-assets/published/${windows_name}"
          (
            cd release-assets/published
            sha256sum "${macos_arm64_name}" "${macos_x86_64_name}" "${windows_name}" \
              > "${checksums_name}"
          )

          git tag --force "${RELEASE_TAG}" "${SOURCE_COMMIT}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

          notes_file="${RUNNER_TEMP}/development-release-notes.md"
          {
            cat <<EOF
          # ${RELEASE_TITLE}

          - Build identifier: \`${BUILD_IDENTIFIER}\`
          - Source commit: \`${SOURCE_COMMIT}\`
          - Package version: \`${PACKAGE_VERSION}\`
          - UTC date: \`${RELEASE_DATE}\`
          - Progressive run number: ${GITHUB_RUN_NUMBER}
          - Warning: This is an unsigned native development build.
          - Workflow run: ${WORKFLOW_RUN_URL}

          ## Changes since previous release

          EOF
            cat "${RUNNER_TEMP}/development-changelog.md"
          } > "${notes_file}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --prerelease \
              --title "${RELEASE_TITLE}" \
              --notes-file "${notes_file}" \
              --target "${SOURCE_COMMIT}"
          else
            gh release create "${RELEASE_TAG}" \
              --prerelease \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file "${notes_file}"
          fi

          existing_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r asset_name; do
            [[ -z "${asset_name}" ]] && continue
            gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --yes
          done <<< "${existing_assets}"

          gh release upload "${RELEASE_TAG}" \
            "release-assets/published/${macos_arm64_name}" \
            "release-assets/published/${macos_x86_64_name}" \
            "release-assets/published/${windows_name}" \
            "release-assets/published/${checksums_name}"
