name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run checks
        run: uv run nox -s ci

  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run GUI checks
        run: uv run nox -s gui

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run extension tests
        run: uv run nox -s extension

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  dependabot-merge:
    needs:
      - tests
      - gui
      - extension
      - website
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # A group reports its highest bump. Anything else, including an unknown
      # type, stays open for a person to review.
      - name: Merge and run CI on master
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
          # A merge made with GITHUB_TOKEN starts no push workflows, but dispatch is allowed.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
