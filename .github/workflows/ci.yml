name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run checks
        run: uv run nox -s ci

  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run GUI checks
        run: uv run nox -s gui

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run extension tests
        run: uv run nox -s extension
