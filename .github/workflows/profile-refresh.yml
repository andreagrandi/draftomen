name: Profile Refresh

on:
  schedule:
    # GitHub Actions evaluates schedules in UTC.
    - cron: "17 6 * * *"
    - cron: "47 6 * * 0"
  workflow_dispatch:
    inputs:
      selection_mode:
        description: Generation selection mode.
        required: true
        type: choice
        options:
          - one
          - all
          - active
          - historical
        default: all
      set:
        description: Exact set code or name; required only for one.
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked

      - name: Generate website data
        id: generate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_SELECTION_MODE: ${{ inputs.selection_mode || '' }}
          INPUT_SET: ${{ inputs.set || '' }}
          BASE_COMMIT: ${{ github.sha }}
          REPO_ROOT: ${{ github.workspace }}
          WORK_DIR: ${{ runner.temp }}/draftomen-profile-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          BUNDLE_DIR="$WORK_DIR/bundle"
          CACHE_DIR="$WORK_DIR/cache"
          mkdir -p "$BUNDLE_DIR" "$CACHE_DIR"

          selection_mode=""
          selector=""
          case "$EVENT_NAME" in
            workflow_dispatch)
              selection_mode="$INPUT_SELECTION_MODE"
              selector="$INPUT_SET"
              ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                "17 6 * * *") selection_mode="active" ;;
                "47 6 * * 0") selection_mode="historical" ;;
                *)
                  printf '%s\n' "Unknown scheduled event." >&2
                  exit 2
                  ;;
              esac
              ;;
            *)
              printf '%s\n' "Unsupported workflow event." >&2
              exit 2
              ;;
          esac

          generation_args=(
            run python scripts/profile_refresh_workflow.py generate
            --selection-mode "$selection_mode"
            --base-commit "$BASE_COMMIT"
            --bundle-dir "$BUNDLE_DIR"
            --cache-dir "$CACHE_DIR"
            --repo-root "$REPO_ROOT"
          )
          case "$selection_mode" in
            one)
              if [[ -z "$selector" ]]; then
                printf '%s\n' "The one selection requires a set." >&2
                exit 2
              fi
              generation_args+=(--set "$selector")
              ;;
            all|active|historical)
              if [[ -n "$selector" ]]; then
                printf '%s\n' "A set is allowed only for one selection." >&2
                exit 2
              fi
              ;;
            *)
              printf '%s\n' "Unknown selection mode." >&2
              exit 2
              ;;
          esac

          generation_status=0
          if uv "${generation_args[@]}"; then
            :
          else
            generation_status=$?
          fi
          exit "$generation_status"

      - name: Append generation summary
        id: summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          WORK_DIR: ${{ runner.temp }}/draftomen-profile-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          BUNDLE_DIR="$WORK_DIR/bundle"
          summary_status=0
          if [[ -s "$BUNDLE_DIR/summary.md" ]]; then
            if cat "$BUNDLE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; then
              :
            else
              summary_status=$?
            fi
          else
            summary_status=1
          fi
          exit "$summary_status"

      - name: Upload generation bundle
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: profile-refresh-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draftomen-profile-refresh-${{ github.run_id }}-${{ github.run_attempt }}/bundle
          retention-days: 7
          if-no-files-found: error

      - name: Propagate generation status
        if: ${{ always() }}
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -u
          if [[ "$GENERATION_OUTCOME" == success ]] \
            && [[ "$SUMMARY_OUTCOME" == success ]] \
            && [[ "$UPLOAD_OUTCOME" == success ]]; then
            exit 0
          fi
          exit 1

  publish:
    needs: generate
    if: >-
      ${{ !cancelled() &&
          github.ref == 'refs/heads/master' &&
          needs.generate.outputs.artifact-id != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: profile-refresh-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download generation bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/draftomen-profile-publication/bundle

      - name: Publish generated website data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_ROOT: ${{ github.workspace }}
          BUNDLE_DIR: ${{ runner.temp }}/draftomen-profile-publication/bundle
        run: |
          set -euo pipefail
          uv run python -m scripts.profile_refresh_publication \
            --repo-root "$REPO_ROOT" \
            --bundle-dir "$BUNDLE_DIR" \
            --base-commit "$BASE_COMMIT" \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --run-url "$RUN_URL" \
            --summary-file "$GITHUB_STEP_SUMMARY"
