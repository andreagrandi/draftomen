[project]
name = "draftomen"
version = "0.3.1"
description = "An unofficial Quick Draft assistant for MTG Arena"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Andrea Grandi" }]
keywords = [
    "draft",
    "magic-the-gathering",
    "mtg-arena",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pyside6>=6.9,<7",
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[project.scripts]
draftomen-gui-mockup = "draftomen.qt_mock:main"
draftomen-tui = "draftomen.cli:main"

[project.gui-scripts]
draftomen = "draftomen.qt_gui:main"

[project.urls]
Homepage = "https://github.com/andreagrandi/draftomen"
Repository = "https://github.com/andreagrandi/draftomen"
Issues = "https://github.com/andreagrandi/draftomen/issues"

[dependency-groups]
dev = [
    "nox>=2026.4.10",
    "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draftomen*"]
[tool.setuptools.package-data]
draftomen = [
    "assets/*.icns",
    "assets/*.ico",
    "assets/*.png",
    "qml/*.qml",
    "qml/qmldir",
]
[tool.pyside6-project]
# Explicit deployment inputs: Python sources, bundled baseline, QML, and assets.
# No fonts are bundled.
files = [
    "draftomen/__init__.py",
    "draftomen/audit.py",
    "draftomen/backtest.py",
    "draftomen/benchmark.py",
    "draftomen/carddb.py",
    "draftomen/cardimages.py",
    "draftomen/card_data_client.py",
    "draftomen/card_data_export.py",
    "draftomen/cli.py",
    "draftomen/config.py",
    "draftomen/corpus.py",
    "draftomen/deckbuilder.py",
    "draftomen/events.py",
    "draftomen/guide_client.py",
    "draftomen/logfollow.py",
    "draftomen/mock_session.py",
    "draftomen/openrouter_client.py",
    "draftomen/paths.py",
    "draftomen/pickengine.py",
    "draftomen/pool.py",
    "draftomen/pool_ledger.py",
    "draftomen/preferences.py",
    "draftomen/profile_client.py",
    "draftomen/profile_generation.py",
    "draftomen/profile_generation_execution.py",
    "draftomen/profile_generation_stage_policy.py",
    "draftomen/profile_input_acquisition.py",
    "draftomen/profile_input_cache.py",
